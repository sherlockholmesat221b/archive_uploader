[project]
name = "archive-uploader"
version = "2.0.2"
description = "Resumable FLAC/album uploader for the Internet Archive, with online metadata enrichment."
requires-python = ">=3.10"
dependencies = [
    "mutagen",
    "requests",
    "musicbrainzngs",
    "internetarchive",
    # kabooz (Qobuz) is optional — QobuzProvider no-ops gracefully if it's
    # not installed / not configured.
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
archive-uploader = "archive_uploader.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["archive_uploader*"]
